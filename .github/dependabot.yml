version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "daily"

  # The test toolchain is a separate Composer project on purpose (see
  # tests/tools/composer.json); without its own entry the lock silently rots.
  - package-ecosystem: "composer"
    directory: "/tests/tools"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: chore
    groups:
      test-tools:
        patterns: ["*"]

  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      nix:
        patterns: ["*"]